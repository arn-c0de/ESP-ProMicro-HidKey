name: "CodeQL"

on:
  push:
    branches: [ "main", "master", "2.0.*" ]
  pull_request:
    branches: [ "main", "master", "2.0.*" ]
  schedule:
    - cron: '25 14 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # For c-cpp, CodeQL traces a real compile. Build the firmware with
      # arduino-cli so the .ino + aes.h are extracted and analyzed.
      - name: Set up Arduino CLI
        if: matrix.language == 'c-cpp'
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 0.35.3

      - name: Build firmware (c-cpp, traced by CodeQL)
        if: matrix.language == 'c-cpp'
        run: |
          arduino-cli core install arduino:avr@1.8.6
          arduino-cli lib install Keyboard
          pip install -r requirements.txt
          cp .env.example .env
          python generate_password_header.py
          arduino-cli compile --fqbn arduino:avr:leonardo ESP-ProMicro-HidKey.ino

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
