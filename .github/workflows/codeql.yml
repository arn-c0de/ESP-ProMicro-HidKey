name: "CodeQL"

on:
  push:
    branches: [ "2.0.1", "main", "master" ]
  pull_request:
    branches: [ "2.0.1", "main", "master" ]
  schedule:
    - cron: '25 14 * * 1'

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  build-arduino:
    name: Build Arduino
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install board and libraries
        run: |
          arduino-cli core install arduino:avr
          arduino-cli lib install Keyboard

      - name: Generate test passwords header
        run: |
          cp .env.example .env
          pip install pycryptodomex
          python generate_password_header.py

      - name: Compile sketch
        run: |
          arduino-cli compile --fqbn arduino:avr:leonardo ESP-ProMicro-HidKey.ino
